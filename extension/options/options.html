<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="options.css">
  <title>ZDownloader 助手 - 设置</title>
</head>
<body>
  <main class="wrap">
    <h1><span class="logo">Z</span> ZDownloader 助手</h1>

    <section class="card">
      <h2>核心连接</h2>
      <div class="row">
        <label>核心地址</label>
        <input type="text" id="server" placeholder="http://127.0.0.1:8620" spellcheck="false">
        <button id="testBtn" class="btn">测试连接</button>
      </div>
      <div class="hint" id="testResult"></div>
    </section>

    <section class="card">
      <h2>下载捕获</h2>
      <div class="switch-row">
        <label class="switch"><input type="checkbox" id="enabled"><span class="track"></span></label>
        <span>启用下载捕获(自动接管浏览器下载)</span>
      </div>
      <div class="switch-row">
        <label class="switch"><input type="checkbox" id="captureMedia"><span class="track"></span></label>
        <span>嗅探页面媒体资源(视频 / 音频 / HLS)</span>
      </div>
      <div class="row">
        <label>媒体嗅探最小体积(MB,小于该值的媒体不嗅探;0 = 全部)</label>
        <input type="number" id="minSizeMB" min="0" step="1">
      </div>
      <div class="row">
        <label>忽略的扩展名(逗号分隔)</label>
        <input type="text" id="extBlacklist" spellcheck="false">
      </div>
      <div class="row">
        <label>忽略的域名(逗号分隔)</label>
        <input type="text" id="domainBlacklist" spellcheck="false">
      </div>
    </section>

    <section class="card">
      <h2>通知</h2>
      <div class="switch-row">
        <label class="switch"><input type="checkbox" id="notify"><span class="track"></span></label>
        <span>接管失败时弹出系统通知(推荐开启)</span>
      </div>
      <div class="switch-row">
        <label class="switch"><input type="checkbox" id="notifySuccess"><span class="track"></span></label>
        <span>接管成功也弹通知(默认关闭,仅角标闪烁;开启后短时间多次接管会合并为一条)</span>
      </div>
    </section>

    <div class="actions">
      <button id="save" class="btn primary">保存设置</button>
      <span id="saved" class="hint">已保存</span>
    </div>
  </main>

  <script src="options.js"></script>
</body>
</html>
